

        <input type="number" nbInput fullWidth placeholder="Plant Id" [(ngModel)]="newPlant.id" />
        <input type="text" nbInput fullWidth placeholder="Plant Name" [(ngModel)]="newPlant.orgName">
        
          <input type="text" nbInput fullWidth placeholder="Plant Description" [(ngModel)]="newPlant.orgDescription">
          <!-- <input type="text" nbInput fullWidth placeholder="Last Name"> -->

        <!-- <input type="text" nbInput fullWidth shape="rectangle" placeholder="Rectangle border"> -->
       
        <nb-select [(ngModel)]="newPlant.plant">
            <nb-option  *ngFor="let opt of plantList" 
            [value]="opt" >
                {{opt}} 
            </nb-option>
            <!-- <nb-option value="2">Option 2</nb-option> -->
          </nb-select>
 
          <button  nbButton hero status='primary' (click)="savePlant()">Add New Plant</button>
