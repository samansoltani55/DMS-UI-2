
<div class="col-lg-12">
        <input type="number" nbInput fullWidth placeholder="Equipments Id" [(ngModel)]="newEquipments.id" />
        <input type="text" nbInput fullWidth placeholder="Equipments Name" [(ngModel)]="newEquipments.equipmentName">
        
          <input type="text" nbInput fullWidth placeholder="Equipments Description" [(ngModel)]="newEquipments.equipmentDescription">
          <!-- <input type="text" nbInput fullWidth placeholder="Last Name"> -->

        <!-- <input type="text" nbInput fullWidth shape="rectangle" placeholder="Rectangle border"> -->
       
        <google-map [center]="center" [zoom]="zoom" width="100%" height="15rem" (mapClick)="onMapClick($event)" >
          
  <!-- <map-marker *ngIf="markerPosition" [position]="markerPosition" -->
          <!-- <map-marker [position]="position"></map-marker> -->
          <map-marker *ngIf="markerPosition" [position]="markerPosition"></map-marker>
        </google-map>
 
          <button  nbButton hero status='primary' (click)="saveEquipments()">Add New Equipments</button>
 </div>
